<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="vista/CSS/style.css">
    <link rel="icon" type="image/png" href="vista/pageIcon.png">
    <title>Alquila Ya!</title>
</head>
<body>

    <header>

    <nav>
        <div id="superior">

            <div class="variados">
                <h2>Renta Ya!</h2>
            </div>


            <div class="variados">

                <div>
                    <!-- lista desplegable -->
                    <select>
                        <option>Todos los departamentos</option>
                    </select>
                </div>

                <div>
                    <!--Input-->
                    <input type="text" placeholder="Buscar">
                </div>

                <div>
                    <!-- boton de busqueda -->
                    <button><img src="vista/buscar.png" width="25px" height="28px"></button>
                </div>

            </div>

            <div class="variados">
                <img src="/vista/estados-unidos.png" width="13px" height="13px" alt="">
                <span>ES</span>
            </div>

            <div style="display: flex; flex-direction: column;">
                <span>Hola, identifícate</span>
                <span><strong>Registrate o inicia sesión</strong></span>
            </div>

            <div style="display: flex; flex-direction: column;">
                <span>Devoluciones</span>
                <span>y pedidos</span>
            </div>

            <div>
                <img src="vista/carrito-de-compras.png" width="48px" height="48px" alt="">
            </div>

        </div>
    </nav>
    </header>

    <main>

        <h1 style="text-align: center;">¿Que deseas alquilar?</h1>

    <section>

        <article>

            <div class="cart">
                <h2>Herramientas Industriales</h2>
                <figure>
                    <img src="vista/category_img/herramientas.jpg">
                </figure>
            </div>

        </article>


        <article>

            <div class="cart">
                <h2>Maquinaria</h2>
                <figure>
                    <img src="vista/category_img/electrodomésticos.jpg" width="50px" height="20px">
                </figure>
            </div>

        </article>


        <article>

            <div class="cart">
                <h2>Espacios</h2>
                <figure>
                    <img src="vista/category_img/estudio.jpg">
                </figure>
            </div>
            
        </article>


        <article>

            <div class="cart">
                <h2>Talento humano</h2>
                <figure>
                    <img src="vista/category_img/aparatos.jpg">
                </figure>
            </div>

        </article>

        <article>
            <div class="cart">
                <h2>Vehiculos</h2>
                <figure>

                </figure>
            </div>
        </article>

    </section>

    

    <section>
        
        <div class="scroll_section">

            <figure>
                <img src="vista/aspiradora_mano.png" alt="">
                <img src="vista/batidora_cafe.png" alt="">
                <img src="vista/manguera.png" alt="">
                <img src="vista/removedor_pelusa.jpg" alt="">
                <img src="vista/proyector.jpg" alt="">
                <img src="vista/andamios.jpg" alt="">
            </figure>

        </div>

    </section>

    </main>
    <footer>
        <header><p>Inicio de página</p></header>
    </footer>

</body>
</html>
