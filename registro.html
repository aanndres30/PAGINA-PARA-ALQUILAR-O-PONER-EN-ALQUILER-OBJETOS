<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="vista/CSS/nievo_registro.css">
    <title>Renta Ya! - Nuevo Registro</title>
    <link rel="icon" type="image/png" href="vista/pageIcon.png">
</head>
<body>
    
    <div id="contenedor_login">

        <fieldset>

            <h1>Renta Ya!</h1>

            <h2>Regístrate</h2>

            <div class="grupo_campo">
            <label for="">Nombre de usuario</label>
            <input type="text" name="" id="" placeholder="Ingrese el nombre de usuario">
            </div>

            <div class="grupo_campo">
                <label for="">Correo electrónico</label>
                <input type="text" placeholder="ejemplo@gmail.com">
            </div>

            <div class="grupo_campo">
            <label for="">Contraseña</label>
            <input type="password" name="" id="" placeholder="Ingrese una contraseña">
            </div>

            <div class="grupo_botones">
                <button>Crear nueva cuenta</button>
                <button>Cancelar</button>
            </div>

            <div class="options">
            <a href="login.html">Volver</a>
            </div>    

        </fieldset>

    </div>

</body>
</html>
